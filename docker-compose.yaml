# Dograh deployment stack — driven by the helper scripts, not by a bare
# `docker compose up`.
#
# This stack needs a generated .env (secrets, public host/URL) and, for the
# remote/TURN profiles, runtime nginx/coturn config rendered by the dograh-init
# service. The setup scripts create those for you — start with them:
#
#   Local:          ./start_docker.sh        (Windows: .\start_docker.ps1)
#   Remote server:  sudo ./setup_remote.sh   then ./remote_up.sh
#
# Running `docker compose up` against a fresh checkout will fail or come up
# misconfigured (e.g. OSS_JWT_SECRET is required). Full guide:
# https://docs.dograh.com/deployment/docker

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped   # AHS 2026-06-09: survive host/Docker reboot
    environment:
      POSTGRES_USER: postgres
      # Sourced from .env. Defaults to "postgres"
      # NOTE: changing this on an existing install does NOT
      # re-key the database — the password is baked into the volume on first init.
      # You can manually change the password using psql in the container
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # ports dropped (AHS 2026-06-07): internal-only, avoids host 5432/5433 conflict
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped   # AHS 2026-06-09: survive host/Docker reboot
    # ports dropped (AHS 2026-06-07): internal-only, avoids valkey 6379 conflict
    expose:
      - "6379"
    command: >
      --requirepass ${REDIS_PASSWORD:-redissecret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  minio:
    image: minio/minio   # AHS 2026-09-26: upstream moved to quay.io/minio/minio; anonymous pull returned "unauthorized". Keep the local image that owns dograh_minio-data.
    container_name: minio
    restart: unless-stopped   # AHS 2026-06-09: survive host/Docker reboot
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:9003:9001" # AHS 2026-06-07: console only on 9003 (9000=zoho-shim); api uses minio:9000 internally
    expose:
      - "9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # AHS 2026-06-07: /voice-audio → minio (matches dograh's nginx template)
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.dograh-audio.rule=Host(`voice.ahsbots.com`) && PathPrefix(`/voice-audio`)"
      - "traefik.http.routers.dograh-audio.priority=90"
      - "traefik.http.routers.dograh-audio.entrypoints=websecure"
      - "traefik.http.routers.dograh-audio.tls=true"
      - "traefik.http.routers.dograh-audio.tls.certresolver=letsencrypt"
      - "traefik.http.services.dograh-audio.loadbalancer.server.port=9000"
    networks:
      - app-network
      - web_proxy

  dograh-init:
    image: bash:5.2
    container_name: dograh_init
    profiles: ["remote", "local-turn"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      SERVER_IP: "${SERVER_IP:-}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-http://localhost:8000}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-1}"
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./deploy:/workspace/deploy:ro
      - ./certs:/certs:ro
      - nginx-generated:/generated/nginx
      - coturn-generated:/generated/coturn
    command:
      - /workspace/scripts/run_dograh_init.sh

  nginx:
    image: nginx:alpine
    container_name: nginx_https
    profiles: ["remote"]
    depends_on:
      dograh-init:
        condition: service_completed_successfully
      ui:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-generated:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - app-network

  coturn:
    image: coturn/coturn:4.8.0
    container_name: coturn
    restart: unless-stopped
    profiles: ["remote", "local-turn"]
    depends_on:
      dograh-init:
        condition: service_completed_successfully
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - coturn-generated:/etc/coturn:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
    networks:
      - app-network

  # AHS 2026-06-08: persistent SSH tunnel to Wazo's localhost-bound ARI (127.0.0.1:5039).
  # dograh's ARI provider uses http://ari-tunnel:5039 (control channel). Media flows the
  # OTHER way: Wazo's websocket_client.conf connects out to wss://voice.ahsbots.com.
  ari-tunnel:
    # AHS 2026-09-26: opt-in only. Its target (wazo.ahsbots.com droplet) was destroyed 2026-08-07 and the old IP
    # now presents a different SSH host key; this service uses StrictHostKeyChecking=no. Start with --profile wazo-tunnel
    # only after repointing it at a PBX we own.
    profiles: ["wazo-tunnel"]
    image: alpine:3.20
    container_name: dograh-ari-tunnel
    restart: unless-stopped
    volumes:
      - ./secrets:/keys:ro  # stable key copy (orig ssh-keys/id_ed25519 corrupted to dir by WSL mount hazard)
    command: >
      sh -c "apk add --no-cache autossh openssh-client >/dev/null 2>&1 &&
      cp /keys/wazo_ari_key /tmp/key && chown root:root /tmp/key && chmod 600 /tmp/key &&
      exec autossh -M 0 -N -T
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes
      -i /tmp/key -L 0.0.0.0:5039:127.0.0.1:5039 root@wazo.ahsbots.com"
    networks:
      - app-network

  api:
    image: ahs-dograh-api:1.47.0-ahs4   # AHS 2026-09-26: thin layer over dograhai/dograh-api:1.47.0 (Dockerfile.ahs-api)
    build:
      context: .
      dockerfile: Dockerfile.ahs-api
    restart: unless-stopped   # AHS 2026-06-09: survive host/Docker reboot
    extra_hosts:
      - "host.docker.internal:host-gateway"   # AHS 2026-06-07: robust CLIProxy reach (:8417)
    environment:
      # Core application config
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      LOG_LEVEL: "INFO"

      # Set to "false" in .env to disable public signup (invite-only installs).
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"
      AHS_VAD_STOP_SECS: "${AHS_VAD_STOP_SECS:-0.8}"   # AHS: VAD end-of-segment silence (upstream hardcodes 0.2)
      AHS_VAD_CONFIDENCE: "${AHS_VAD_CONFIDENCE:-0.7}"   # AHS: speech-probability threshold (upstream 0.7)
      AHS_VAD_MIN_VOLUME: "${AHS_VAD_MIN_VOLUME:-0.6}"   # AHS: minimum loudness to count as speech (upstream 0.6)

      # Public origin for this deployment. The API derives BACKEND_API_ENDPOINT,
      # MINIO_PUBLIC_ENDPOINT and TURN_HOST from PUBLIC_BASE_URL / PUBLIC_HOST when
      # they are not set explicitly (see api/constants.py), so a standard remote
      # install only needs PUBLIC_BASE_URL + PUBLIC_HOST in .env.
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      PUBLIC_HOST: "${PUBLIC_HOST:-}"

      # Optional explicit override of the public URL the backend builds webhook /
      # embed links from. Defaults to PUBLIC_BASE_URL. When the value is non-public
      # (localhost or a private/reserved IP), the API resolves a running Cloudflare
      # tunnel's URL at runtime instead (see api/utils/common.py).
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-}"

      # Database configuration (using containerized postgres)
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres"

      # Redis configuration (using containerized redis)
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redissecret}@redis:6379"

      # Storage configuration - bundled MinIO by default. Set ENABLE_AWS_S3=true
      # in .env to make the API use AWS S3 or another S3-compatible server.
      ENABLE_AWS_S3: "${ENABLE_AWS_S3:-false}"

      # S3 backend configuration. Compose's .env file is used for interpolation,
      # but those values are not automatically injected into containers, so pass
      # the S3 settings through explicitly.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"

      # For a non-AWS S3-compatible server, also set these in Compose's .env
      # S3_ENDPOINT_URL        e.g. https://s3.example.com
      # S3_SIGNATURE_VERSION   set "s3v4" if the server requires SigV4 (e.g. rustfs)
      # S3_ADDRESSING_STYLE    set "path" if the server / TLS cert requires path-style
      # The S3 backend issues real presigned URLs, so the bucket can stay private.
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_SIGNATURE_VERSION: "${S3_SIGNATURE_VERSION:-}"
      S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-}"

      # MinIO
      MINIO_ENDPOINT: "minio:9000"
      # Full URL (with scheme) browsers use to reach MinIO. Defaults to
      # PUBLIC_BASE_URL for remote deployments (nginx proxies /voice-audio/) and to
      # http://localhost:9000 for local; override only for a separate object store.
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"

      # Number of uvicorn worker processes (each is its own process bound to a
      # distinct port starting at 8000). dograh-init renders nginx upstreams
      # from this value and nginx load-balances across them with least_conn.
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-1}"

      # Optional singleton background services started by the container CMD
      # (scripts/start_services_docker.sh). Both default to on; set either to
      # "false" in .env to run this container as an API/worker node only — e.g. a
      # scale-out replica that must not also run the telephony ARI bridge
      # (ari_manager) or the outbound campaign loop (campaign_orchestrator).
      ENABLE_ARI_MANAGER: "${ENABLE_ARI_MANAGER:-true}"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "${ENABLE_CAMPAIGN_ORCHESTRATOR:-true}"

      # Trust X-Forwarded-* headers from any peer so uvicorn honors nginx's
      # `X-Forwarded-Proto: https`. nginx runs as its own container and reaches
      # uvicorn from a Docker-network IP (not loopback), but uvicorn trusts only
      # 127.0.0.1 by default — so without this it ignores the header, request.url
      # comes back as http://…, and inbound webhook signature checks fail for
      # every provider at once (telephony providers sign the public https URL, so
      # the recomputed signature won't match). "*" trusts all peers; the api port
      # (8000) is published, so firewall/harden it at the host — or narrow this
      # to your Docker bridge subnet — if that exposure matters to you.
      FORWARDED_ALLOW_IPS: "*"

      # Langfuse — credentials can be set here or per-organization via the UI
      # at /settings. Tracing is automatically active when credentials are
      # available; uncomment to set defaults for all organizations.
      # LANGFUSE_SECRET_KEY: ""
      # LANGFUSE_PUBLIC_KEY: ""
      # LANGFUSE_HOST: ""
      # LANGFUSE_PROJECT_ID: ""
      # Traces are private by default. Set to "true" to make traces in the
      # project above readable by anyone holding the trace URL, with no
      # Langfuse login. Organizations that connected their own Langfuse project
      # in the UI carry their own visibility setting instead.
      LANGFUSE_TRACES_PUBLIC: "${LANGFUSE_TRACES_PUBLIC:-false}"

      # TURN server configuration (for WebRTC NAT traversal in remote server)
      # Uses time-limited credentials via TURN REST API (HMAC-SHA1).
      ENABLE_COTURN: "${ENABLE_COTURN:-false}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      FORCE_TURN_RELAY: "${FORCE_TURN_RELAY:-false}"
      SERVER_IP: "${SERVER_IP:-}"

      OSS_JWT_SECRET: "${OSS_JWT_SECRET:?OSS_JWT_SECRET must be set to a strong secret}"

      # Telephony media WebSocket capability token. The carrier dials the media
      # socket back, so its URL is caller-visible and the ids in it are otherwise
      # guessable. Set a secret in .env to have providers sign that URL and the
      # handler verify it; leave it unset and nothing changes. Roll out in two
      # steps: set the secret first (invalid tokens are logged but allowed), then
      # set ENFORCE=true once the logs stay clean.
      TELEPHONY_WS_TOKEN_SECRET: "${TELEPHONY_WS_TOKEN_SECRET:-}"
      TELEPHONY_WS_TOKEN_ENFORCE: "${TELEPHONY_WS_TOKEN_ENFORCE:-false}"

      # Telemetry
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-true}"
      POSTHOG_API_KEY: "phc_ItizB1dP6yv7ZYobbcqrpxTdbomDA8hJFSEmAMdYvIr"
      POSTHOG_HOST: "https://us.i.posthog.com"

    ports:
      - "127.0.0.1:8000:8000" # AHS 2026-06-07
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'').read()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      # AHS 2026-06-07: /api/v1 (incl. WS signaling) → backend directly, matching dograh's
      # nginx template. Traefik handles the WS Upgrade. Priority 100 > ui root router (1).
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.dograh-api.rule=Host(`voice.ahsbots.com`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.dograh-api.priority=100"
      - "traefik.http.routers.dograh-api.entrypoints=websecure"
      - "traefik.http.routers.dograh-api.tls=true"
      - "traefik.http.routers.dograh-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.dograh-api.loadbalancer.server.port=8000"
    networks:
      app-network: {}
      web_proxy: {}
      # AHS 2026-09-27: local Wazo lab (projects/wazo-local). Asterisk reaches us at ws://dograh-api:8000
      # for call media; we reach its ARI at http://asterisk:5039. Needs the lab network to exist.
      wazo-lab:
        aliases: [dograh-api]

  ui:
    image: ahs-voice-ui:latest   # AHS white-label local build (was ${REGISTRY:-dograhai}/dograh-ui:latest)
    restart: unless-stopped   # AHS 2026-06-09: survive host/Docker reboot
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      # AHS 2026-06-07: Docker auto-sets HOSTNAME=<container-id>; Next.js standalone binds to that
      # hostname's single IP instead of 0.0.0.0. With 2 networks (app-network+web_proxy) that broke
      # the host publish + healthcheck + made it "unhealthy" so Traefik skipped it. Force 0.0.0.0.
      HOSTNAME: "0.0.0.0"
      # Server-side URL (SSR, internal Docker network)
      BACKEND_URL: "${BACKEND_URL:-http://api:8000}"
      NODE_ENV: "oss"

      # Flag to enable/ disable posthog
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-true}"

      # Posthog
      POSTHOG_KEY: "phc_ItizB1dP6yv7ZYobbcqrpxTdbomDA8hJFSEmAMdYvIr"
      POSTHOG_HOST: "https://us.posthog.com"
    ports:
      - "127.0.0.1:3010:3010" # AHS 2026-06-07
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:3010 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
      - web_proxy
    labels:
      # AHS 2026-06-07: dograh UI = ROOT of voice.ahsbots.com (UI proxies its own backend,
      # so only this service needs a route). Low priority so the existing /whisper & /kokoro
      # PathPrefix routers always win. dograh has its own login — NO tts-auth here.
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.dograh.rule=Host(`voice.ahsbots.com`)"
      - "traefik.http.routers.dograh.priority=1"
      - "traefik.http.routers.dograh.entrypoints=websecure"
      - "traefik.http.routers.dograh.tls=true"
      - "traefik.http.routers.dograh.tls.certresolver=letsencrypt"
      - "traefik.http.services.dograh.loadbalancer.server.port=3010"

  # cloudflared service REMOVED (AHS 2026-06-07): default config ran a PUBLIC Cloudflare
  # quick-tunnel exposing api:8000 to the internet. Not wanted; api depends_on entry removed too.

volumes:
  # AHS 2026-06-09: names pinned to the original `dograh_*` so this stack keeps the
  # same data volumes whether run standalone (project `dograh`) OR merged into the
  # `voice-stack` project via include — prevents the DB/object store being orphaned.
  postgres_data:
    name: dograh_postgres_data
  redis_data:
    name: dograh_redis_data
  minio-data:
    name: dograh_minio-data
    driver: local
  nginx-generated:
    name: dograh_nginx-generated
    driver: local
  coturn-generated:
    name: dograh_coturn-generated
    driver: local

networks:
  app-network:
    name: dograh_app-network   # AHS 2026-06-09: pinned (see volumes note)
    driver: bridge
  web_proxy:
    external: true
  wazo-lab:
    external: true
    name: wazo-local_default
